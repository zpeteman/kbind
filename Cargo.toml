[package]
name = "kbind"
version = "0.1.0"
edition = "2021"
authors = ["zpeteman <user@example.com>"]
description = "Natural language shell command generator"
license = "MIT"
repository = "https://github.com/zpeteman/kbind"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "native-tls", "json"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
toml = "0.8"
rpassword = "7.3"

[dev-dependencies]
rexpect = "0.7.1"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[bin]]
name = "kb"
path = "src/main.rs"
